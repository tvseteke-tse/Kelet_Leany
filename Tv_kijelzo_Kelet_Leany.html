<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Kelet-Magyarország Serdülő és Ifjúsági Leány Egyéni Bajnokság - Élő Ranglista</title>
<style>
    * { box-sizing: border-box; }
    html, body { 
        width: 1920px; 
        height: 1080px; 
        margin: 0; 
        padding: 15px; 
        overflow: hidden; 
        background-color: #00122e; 
        color: #ffff00; 
        font-family: 'Segoe UI', Arial, sans-serif; 
        user-select: none; 
    }
    
    .board-container { 
        width: 100%; 
        height: 100%; 
        margin: 0 auto; 
        background: #001c47; 
        border: 3px solid #0044aa; 
        border-radius: 12px; 
        padding: 20px; 
        box-shadow: 0 0 30px rgba(0, 50, 150, 0.6); 
        display: flex; 
        flex-direction: column;
        overflow: hidden;
    }

    h1 { text-align: center; margin: 0 0 15px 0; font-size: 2.2rem; color: #ffff00; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 255, 0, 0.4); flex-shrink: 0; }
    
    /* Oszlopok elrendezése a két kategóriához (bal: Serdülő, jobb: Ifjúsági) */
    .tables-wrapper {
        display: flex;
        gap: 30px;
        width: 100%;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }

    .category-column {
        flex: 1;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: rgba(0, 28, 71, 0.5);
        border: 2px solid #003388;
        border-radius: 8px;
        padding: 10px;
    }

    .category-title {
        text-align: center;
        font-size: 1.5rem;
        color: #00ff66;
        margin: 0 0 10px 0;
        text-transform: uppercase;
        text-shadow: 0 0 5px rgba(0, 255, 102, 0.4);
        flex-shrink: 0;
    }

    .table-responsive {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    table { width: 100%; border-collapse: collapse; font-family: 'Courier New', Courier, monospace; table-layout: fixed; }
    th { color: #ffff00; border-bottom: 2px solid #0044aa; padding: 7px 4px; font-size: 1rem; white-space: nowrap; }
    td { padding: 7px 4px; text-align: center; border-bottom: 1px solid #002b66; font-size: 1.05rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .rank-col { width: 45px; color: #ffffff; text-align: center; overflow: visible !important; text-overflow: clip !important; }
    .name-col { text-align: left; font-family: sans-serif; color: #ffff00; width: 190px; }
    .stat-col { color: #8b949e; font-size: 1.05rem; }
    
    .color-green { color: #00ff66 !important; text-shadow: 0 0 5px rgba(0, 255, 102, 0.4); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 5px rgba(255, 255, 0, 0.4); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 5px rgba(255, 51, 51, 0.4); }

    .total-col { font-weight: bold; font-size: 1.15rem; }
    tr.top3 { background-color: rgba(0, 68, 170, 0.4); }
    tr.top3 .rank-col { color: #ffff00; font-size: 1.1rem; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="board-container">
    <h1 id="boardTitle">Kelet-Magyarország Serdülő és Ifjúsági Leány Egyéni Bajnokság</h1>
    
    <div class="tables-wrapper">
        <!-- Bal oldali oszlop: Serdülő -->
        <div class="category-column">
            <h2 class="category-title" id="titleSerdulo">Serdülő</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="rank-col">#</th>
                            <th class="name-col">Név</th>
                            <th>Teli</th>
                            <th>Tarol</th>
                            <th>Üres</th>
                            <th class="total-col">Össz.</th>
                        </tr>
                    </thead>
                    <tbody id="boardBodySerdulo"></tbody>
                </table>
            </div>
        </div>

        <!-- Jobb oldali oszlop: Ifjúsági -->
        <div class="category-column">
            <h2 class="category-title" id="titleIfjusagi">Ifjúsági</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="rank-col">#</th>
                            <th class="name-col">Név</th>
                            <th>Teli</th>
                            <th>Tarol</th>
                            <th>Üres</th>
                            <th class="total-col">Össz.</th>
                        </tr>
                    </thead>
                    <tbody id="boardBodyIfjusagi"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref('karikupa_egyeni').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) {
        const categories = val.categories || [];
        const categoriesData = val.data || {};

        let serduloCat = categories.find(c => c.name.toLowerCase().includes('serdülő') || c.name.toLowerCase().includes('serdulo'));
        let ifjusagiCat = categories.find(c => c.name.toLowerCase().includes('ifjúsági') || c.name.toLowerCase().includes('ifjusagi'));

        if (!serduloCat && categories.length > 0) serduloCat = categories[0];
        if (!ifjusagiCat && categories.length > 1) ifjusagiCat = categories[1];

        renderCategoryIntoTable(serduloCat, 'titleSerdulo', 'boardBodySerdulo', categoriesData);
        renderCategoryIntoTable(ifjusagiCat, 'titleIfjusagi', 'boardBodyIfjusagi', categoriesData);
    }
});

function getTotalColorClass(val) {
    if (val === 0) return '';
    if (val > 600) return 'color-green';
    if (val < 500) return 'color-red';
    return 'color-yellow';
}

function getUresColorClass(val) {
    if (val === 0) return 'color-green';
    if (val <= 5) return 'color-yellow';
    return 'color-red';
}

function createPlayerRow(player, currentRank) {
    const tr = document.createElement('tr');
    if (currentRank <= 3 && player.total > 0) tr.className = 'top3';

    tr.innerHTML = `
        <td class="rank-col">${currentRank}.</td>
        <td class="name-col">${player.name || '-'}</td>
        <td class="stat-col">${player.teli || 0}</td>
        <td class="stat-col">${player.tarol || 0}</td>
        <td class="stat-col ${getUresColorClass(player.ures)}">${player.ures || 0}</td>
        <td class="total-col ${getTotalColorClass(player.total)}">${player.total || 0}</td>
    `;
    return tr;
}

function renderCategoryIntoTable(catObj, titleElementId, tbodyElementId, categoriesData) {
    const tbody = document.getElementById(tbodyElementId);
    tbody.innerHTML = '';

    if (!catObj) return;

    document.getElementById(titleElementId).innerText = catObj.name;

    const catData = categoriesData[catObj.id] || { players: [] };
    const players = catData.players || [];
    
    const sorted = [...players].sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        if (b.tarol !== a.tarol) return b.tarol - a.tarol;
        if (a.ures !== b.ures) return a.ures - b.ures;
        return 0;
    });

    let currentRank = 1;

    sorted.forEach((player, index) => {
        if (index > 0) {
            const prev = sorted[index - 1];
            if (player.total !== prev.total || player.tarol !== prev.tarol || player.ures !== prev.ures) {
                currentRank = index + 1;
            }
        }

        const row = createPlayerRow(player, currentRank);
        tbody.appendChild(row);
    });
}
</script>
</body>
</html>
